<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unimar Card Tester • v6.3</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .progress-bar { transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    textarea { resize: none; }
    /* Scrollbar customizada */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
  <!-- HEADER -->
  <header class="border-b border-zinc-800 bg-zinc-900 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0">
        <i class="fa-solid fa-credit-card text-2xl text-blue-500 shrink-0"></i>
        <div class="min-w-0">
          <h1 class="text-lg font-bold tracking-tight truncate">Unimar Card Tester</h1>
          <p class="text-xs text-zinc-500">Engine v6.3 • Stable</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <div id="status-container" class="flex items-center gap-2 bg-zinc-800 px-3 py-1.5 rounded-full border border-zinc-700">
          <div id="status-led" class="w-2.5 h-2.5 bg-green-500 rounded-full animate-pulse"></div>
          <span id="status-text" class="text-xs font-medium text-green-400">Online</span>
        </div>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-5 space-y-5">
    <div class="flex flex-col lg:flex-row gap-5 lg:gap-8">
      <!-- ESQUERDA -->
      <div class="flex-1 space-y-5">
        <!-- PROGRESSO -->
        <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800 shadow-xl shadow-black/20">
          <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
            <i class="fa-solid fa-chart-bar text-blue-500"></i>
            Progresso do Lote
          </h2>
          <div class="space-y-3">
            <div class="h-4 bg-zinc-800 rounded-full overflow-hidden relative">
              <div id="progress" class="progress-bar h-full bg-gradient-to-r from-blue-600 to-indigo-600 w-[0%]"></div>
            </div>
            <div class="flex justify-between items-end">
              <div class="text-3xl font-mono font-bold tracking-tight">
                <span id="current">0</span>
                <span class="text-zinc-600 text-2xl mx-1">/</span>
                <span id="total" class="text-zinc-400">0</span>
              </div>
              <p id="status-text-progress" class="text-sm text-zinc-400 font-medium">Aguardando início...</p>
            </div>
          </div>
        </div>

        <!-- BOTÕES -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <button onclick="iniciarTeste()" id="btn-iniciar"
                  class="bg-green-600 hover:bg-green-500 active:scale-[0.98] transition-all text-white font-bold py-4 rounded-2xl text-base flex items-center justify-center gap-2.5 shadow-lg shadow-green-900/20 border border-green-500/20">
            <i class="fa-solid fa-play"></i>
            INICIAR TESTE
          </button>
          <button onclick="pararTeste()" id="btn-parar"
                  class="bg-red-600 hover:bg-red-500 active:scale-[0.98] transition-all text-white font-bold py-4 rounded-2xl text-base flex items-center justify-center gap-2.5 shadow-lg shadow-red-900/20 border border-red-500/20 hidden">
            <i class="fa-solid fa-stop"></i>
            INTERROMPER
          </button>
        </div>

        <!-- LISTA DE CARTÕES -->
        <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800">
          <div class="flex justify-between items-center mb-3">
             <h2 class="text-lg font-semibold">Entrada de Dados</h2>
             <span class="text-xs text-zinc-500 bg-zinc-800 px-2 py-1 rounded">CC|MM|YYYY|CVV</span>
          </div>
          <textarea id="lista-cartoes" rows="10"
            class="w-full bg-zinc-950 border border-zinc-700 rounded-xl p-4 font-mono text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors placeholder-zinc-600"
            placeholder="4111111111111111|12|2028|123"></textarea>
        </div>
      </div>

      <!-- DIREITA -->
      <div class="w-full lg:w-96 space-y-5">
        <!-- CONTADORES -->
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-gradient-to-br from-green-600 to-emerald-700 rounded-2xl p-4 text-center border border-green-500/20 shadow-lg">
            <h2 class="text-green-100 text-xs font-bold tracking-wider uppercase mb-1">Aprovados</h2>
            <div id="approved-count" class="text-4xl font-bold text-white">0</div>
          </div>
          <div class="bg-gradient-to-br from-red-600 to-rose-700 rounded-2xl p-4 text-center border border-red-500/20 shadow-lg">
            <h2 class="text-red-100 text-xs font-bold tracking-wider uppercase mb-1">Reprovados</h2>
            <div id="rejected-count" class="text-4xl font-bold text-white">0</div>
          </div>
        </div>

        <!-- THREADS -->
        <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800">
          <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
            <i class="fa-solid fa-layer-group text-blue-500"></i>
            Threads Paralelas
          </h2>
          <div class="grid grid-cols-6 gap-2" id="canais-buttons"></div>
          <input type="hidden" id="canais" value="4">
        </div>

        <!-- LISTA DE APROVADOS -->
        <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800 flex flex-col h-[200px]">
          <div class="flex justify-between items-center mb-3 shrink-0">
            <h2 class="text-base font-semibold text-green-400">Hits</h2>
            <button onclick="copiarAprovados()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded border border-zinc-700">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <div id="approved-list" class="flex-1 overflow-y-auto space-y-2 font-mono text-xs pr-1">
            <p class="text-zinc-600 text-center py-4 italic">Vazio</p>
          </div>
        </div>

        <!-- LISTA DE REPROVADOS -->
        <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800 flex flex-col h-[200px]">
          <div class="flex justify-between items-center mb-3 shrink-0">
            <h2 class="text-base font-semibold text-red-400">Falhas</h2>
            <button onclick="copiarReprovados()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded border border-zinc-700">
              <i class="fa-regular fa-copy"></i>
            </button>
          </div>
          <div id="rejected-list" class="flex-1 overflow-y-auto space-y-2 font-mono text-xs pr-1">
            <p class="text-zinc-600 text-center py-4 italic">Vazio</p>
          </div>
        </div>

        <!-- LOGS DO SISTEMA (CORRIGIDO) -->
        <div class="bg-zinc-900 rounded-2xl p-5 border border-zinc-800 flex flex-col h-[250px]">
          <div class="flex justify-between items-center mb-3 shrink-0">
            <h2 class="text-base font-semibold text-zinc-400">System Logs</h2>
            <button onclick="limparLogs()" class="text-zinc-500 hover:text-white transition-colors text-xs">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
          <div id="history" class="flex-1 overflow-y-auto space-y-1.5 text-xs font-mono pr-1"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div id="modal-fim" class="hidden fixed inset-0 bg-black/90 backdrop-blur-sm items-center justify-center z-50 p-4">
    <div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-8 w-full max-w-sm text-center shadow-2xl">
      <i class="fa-solid fa-circle-check text-5xl text-green-500 mb-5"></i>
      <h3 class="text-2xl font-bold mb-2 text-white">Concluído</h3>
      <p class="text-zinc-400 mb-6 text-sm">Processamento finalizado.</p>
      <button onclick="fecharModal()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold transition text-white">
        Fechar
      </button>
    </div>
  </div>

  <script>
    // ==================== ESTADO ====================
    let socket = null;
    let testeIniciado = false;
    let totalCartoes = 0;
    
    let stats = { processados: 0, aprovados: 0, reprovados: 0 };
    let listaAprovados = [];
    let listaReprovados = [];
    let reconnectAttempts = 0;

    // ==================== UI HELPERS ====================
    function criarBotoesCanais() {
      const container = document.getElementById('canais-buttons');
      container.innerHTML = '';
      const selected = parseInt(document.getElementById('canais').value);
     
      for (let i = 1; i <= 6; i++) {
        const btn = document.createElement('button');
        const isSelected = i === selected;
        btn.className = `rounded-lg py-2 text-center transition-all active:scale-95 text-sm font-medium ${
          isSelected
            ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20 border border-blue-500'
            : 'bg-zinc-800 hover:bg-zinc-700 text-zinc-400 border border-zinc-700'
        }`;
        btn.textContent = i;
        btn.onclick = () => {
          document.getElementById('canais').value = i;
          criarBotoesCanais();
        };
        container.appendChild(btn);
      }
    }

    // ==================== WEBSOCKET ====================
    function conectarWebSocket() {
      if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) return;
      
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}/ws`;
      
      try {
        socket = new WebSocket(wsUrl);
      } catch (err) {
        agendarReconexao();
        return;
      }

      socket.onopen = () => {
        reconnectAttempts = 0;
        updateStatus("Online", "green");
        addLog("Conectado ao servidor WebSocket.");
      };

      socket.onmessage = (event) => {
        let data;
        try {
          data = JSON.parse(event.data);
        } catch (e) { return; }

        // Roteamento estrito de eventos
        switch (data.type) {
          case "log":
            // Garante que TODO log apareça na caixa de logs
            if (data.mensagem) addLog(data.mensagem);
            break;
          case "aprovado":
            if (data.cartao) handleAprovado(data.cartao);
            break;
          case "reprovado":
            if (data.cartao) handleReprovado(data.cartao);
            break;
          case "progresso":
            stats.processados = data.processados;
            stats.aprovados = data.aprovados;
            totalCartoes = data.total;
            updateStatsUI();
            updateProgressUI();
            break;
          case "status":
            if (data.rodando === false && testeIniciado) {
              finalizarTeste();
            }
            break;
        }
      };

      socket.onclose = () => {
        updateStatus("Reconectando...", "yellow");
        agendarReconexao();
      };
      
      socket.onerror = () => { socket.close(); };
    }

    function agendarReconexao() {
      reconnectAttempts++;
      const delay = Math.min(1000 * Math.pow(2, reconnectAttempts - 1), 10000);
      setTimeout(conectarWebSocket, delay);
    }

    function updateStatus(text, color) {
        const led = document.getElementById('status-led');
        const txt = document.getElementById('status-text');
        txt.textContent = text;
        led.className = `w-2.5 h-2.5 rounded-full animate-pulse bg-${color}-500`;
        txt.className = `text-xs font-medium text-${color}-400`;
    }

    // ==================== HANDLERS ====================
    function handleAprovado(cartao) {
      if (listaAprovados.includes(cartao)) return;
      listaAprovados.push(cartao);
      stats.aprovados++;
      
      const container = document.getElementById('approved-list');
      if (container.children.length > 0 && container.children[0].tagName === 'P') container.innerHTML = '';

      const div = document.createElement('div');
      div.className = "bg-green-900/20 border border-green-500/30 rounded p-2 text-green-300 break-all";
      div.textContent = cartao;
      container.prepend(div);
      updateStatsUI();
    }

    function handleReprovado(cartao) {
      if (listaReprovados.includes(cartao)) return;
      listaReprovados.push(cartao);
      stats.reprovados++;

      const container = document.getElementById('rejected-list');
      if (container.children.length > 0 && container.children[0].tagName === 'P') container.innerHTML = '';

      const div = document.createElement('div');
      div.className = "bg-red-900/20 border border-red-500/30 rounded p-2 text-red-300 break-all opacity-80";
      div.textContent = cartao;
      container.prepend(div);
      updateStatsUI();
    }

    function addLog(msg) {
        const history = document.getElementById('history');
        const div = document.createElement('div');
        
        // Coloração básica baseada no conteúdo
        let colorClass = "text-zinc-400";
        if (msg.includes("APROVADO") || msg.includes("✅")) colorClass = "text-green-400";
        else if (msg.includes("ERRO") || msg.includes("❌") || msg.includes("Falha")) colorClass = "text-red-400";
        else if (msg.includes("Sistema") || msg.includes("Auth") || msg.includes("Faxina")) colorClass = "text-blue-400";
        else if (msg.includes("Canal")) colorClass = "text-zinc-300";

        div.className = `${colorClass} break-words border-l-2 border-zinc-800 pl-2 py-0.5 hover:bg-zinc-800/50 transition-colors`;
        div.textContent = msg;
        
        history.prepend(div);
        // Manter apenas os últimos 100 logs para performance
        if (history.children.length > 100) history.lastChild.remove();
    }

    function updateStatsUI() {
        document.getElementById('approved-count').textContent = stats.aprovados;
        document.getElementById('rejected-count').textContent = stats.reprovados;
        document.getElementById('current').textContent = stats.processados;
    }

    function updateProgressUI() {
        if (totalCartoes === 0) return;
        const pct = Math.min(Math.round((stats.processados / totalCartoes) * 100), 100);
        document.getElementById('progress').style.width = `${pct}%`;
        document.getElementById('total').textContent = totalCartoes;
        
        const statusTxt = document.getElementById('status-text-progress');
        if (pct >= 100) statusTxt.textContent = "Concluído";
        else if (testeIniciado) statusTxt.textContent = "Processando...";
    }

    // ==================== AÇÕES ====================
    function iniciarTeste() {
      const lista = document.getElementById('lista-cartoes').value.trim();
      if (!lista) return alert("Lista vazia.");
      
      // Reset
      stats = { processados: 0, aprovados: 0, reprovados: 0 };
      listaAprovados = [];
      listaReprovados = [];
      testeIniciado = true;
      
      document.getElementById('approved-list').innerHTML = '<p class="text-zinc-600 text-center py-4 italic">Vazio</p>';
      document.getElementById('rejected-list').innerHTML = '<p class="text-zinc-600 text-center py-4 italic">Vazio</p>';
      document.getElementById('history').innerHTML = '';
      updateStatsUI();
      updateProgressUI();
      
      document.getElementById('btn-iniciar').classList.add('hidden');
      document.getElementById('btn-parar').classList.remove('hidden');
      document.getElementById('status-text-progress').textContent = "Iniciando...";

      fetch('/api/iniciar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          lista: lista,
          canais: parseInt(document.getElementById('canais').value)
        })
      })
      .then(res => res.json())
      .then(data => {
          if (data.status === 'já_em_execucao') {
              alert("Teste já em execução.");
              pararTeste();
          }
      })
      .catch(err => {
          console.error(err);
          alert("Erro na API.");
          pararTeste();
      });
    }

    function pararTeste() {
      fetch('/api/parar', { method: 'POST' })
      .then(() => {
          document.getElementById('btn-iniciar').classList.remove('hidden');
          document.getElementById('btn-parar').classList.add('hidden');
          testeIniciado = false;
      });
    }

    function finalizarTeste() {
        testeIniciado = false;
        document.getElementById('btn-iniciar').classList.remove('hidden');
        document.getElementById('btn-parar').classList.add('hidden');
        
        document.getElementById('modal-aprovados').textContent = stats.aprovados;
        document.getElementById('modal-reprovados').textContent = stats.reprovados;
        
        const modal = document.getElementById('modal-fim');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function copiarAprovados() {
      if (listaAprovados.length === 0) return;
      navigator.clipboard.writeText(listaAprovados.join('\n'));
      alert("Aprovados copiados!");
    }

    function copiarReprovados() {
      if (listaReprovados.length === 0) return;
      navigator.clipboard.writeText(listaReprovados.join('\n'));
      alert("Reprovados copiados!");
    }

    function limparLogs() {
      document.getElementById('history').innerHTML = '';
    }

    function fecharModal() {
      document.getElementById('modal-fim').classList.add('hidden');
      document.getElementById('modal-fim').classList.remove('flex');
    }

    // ==================== INIT ====================
    window.onload = () => {
      criarBotoesCanais();
      conectarWebSocket();
    };
  </script>
</body>
</html>
